<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos — Atenas SGE</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/paginas/projetos.css">
</head>
<body data-pagina="projetos">
  <main>
    <header class="pagina-cabecalho">
      <div>
        <h1>Projetos</h1>
        <p>Abra um projeto para ver os dados, os itens (RGs) e as demandas.</p>
      </div>
      <button class="botao" id="btn-novo" type="button"><span data-icone="mais" data-tamanho="18"></span>Novo projeto</button>
    </header>

    <form id="form-projeto" class="cartao form-novo" hidden>
      <h2>Novo projeto</h2>
      <div class="form-grade">
        <div class="campo"><label for="projeto-nome">Nome</label><input type="text" id="projeto-nome" required maxlength="150" placeholder="Ex.: Conjunto de eixos"></div>
        <div class="campo"><label for="projeto-prazo">Prazo (dias)</label><input type="number" id="projeto-prazo" min="1" step="1" placeholder="Ex.: 30"></div>
      </div>
      <div class="campo"><label for="projeto-descricao">Descrição</label><input type="text" id="projeto-descricao" placeholder="Opcional"></div>
      <div class="form-acoes">
        <button type="submit" class="botao">Criar projeto</button>
        <button type="button" class="botao botao--secundario" id="btn-cancelar">Cancelar</button>
      </div>
    </form>

    <div class="barra-filtros">
      <div class="segmentos" role="group" aria-label="Filtrar por status">
        <button type="button" data-filtro="todos" aria-pressed="true">Todos</button>
        <button type="button" data-filtro="ativo" aria-pressed="false">Ativos</button>
        <button type="button" data-filtro="concluido" aria-pressed="false">Concluídos</button>
      </div>
    </div>

    <div id="lista-projetos" class="grade-projetos"></div>

    <div id="vazio" class="estado-vazio" hidden>
      <span class="icone-caixa"><span data-icone="pasta"></span></span>
      <h3>Nenhum projeto por aqui</h3>
      <p id="vazio-texto">Crie o primeiro projeto para começar.</p>
      <button type="button" class="botao" id="btn-vazio-novo">Criar projeto</button>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/projetos.js"></script>
</body>
</html>
