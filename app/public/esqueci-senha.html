<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha — Atenas SGE</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-unico">
    <div class="cartao auth__cartao">
      <img class="auth__logo" src="assets/logo.png" alt="Atenas SGE" onerror="this.style.display='none'">
      <h1>Esqueci minha senha</h1>
      <p class="texto-suave">Informe seu e-mail e enviaremos um link para redefinir a senha.</p>

      <form id="form-esqueci-senha">
        <div class="campo"><label for="email">E-mail</label><input type="email" id="email" name="email" required autocomplete="email"></div>
        <button type="submit" class="botao botao--bloco">Enviar link de redefinição</button>
      </form>

      <p id="mensagem-status" class="aviso aviso--info" hidden></p>

      <p class="auth__links"><a href="login.html">Voltar para o login</a></p>
    </div>
  </main>

  <script src="js/esqueci-senha.js"></script>
</body>
</html>
