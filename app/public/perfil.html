<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Atenas SGE</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/paginas/perfil.css">
</head>
<body data-pagina="perfil">
  <main>
    <header class="pagina-cabecalho">
      <div>
        <h1>Perfil</h1>
        <p>Sua foto e sua bio.</p>
      </div>
    </header>

    <p id="mensagem-status" class="aviso aviso--info" hidden></p>

    <section id="cartao-perfil" class="cartao perfil-cartao" hidden>
      <div class="perfil-banner"></div>
      <div class="perfil-corpo">
        <div class="avatar-wrapper">
          <div id="avatar-iniciais" class="avatar-iniciais" hidden></div>
          <img id="avatar-foto" class="avatar-foto" alt="Foto de perfil" hidden>
          <label id="label-trocar-foto" for="input-foto" class="botao-avatar" hidden aria-label="Trocar foto de perfil" title="Trocar foto de perfil">
            <span data-icone="camera" data-tamanho="16"></span>
          </label>
          <input type="file" id="input-foto" accept="image/jpeg,image/png,image/webp" hidden>
        </div>

        <div class="linha-nome">
          <h2 id="nome-usuario"></h2>
          <button id="btn-editar-bio" class="botao botao--secundario botao--pequeno" type="button" hidden>
            <span data-icone="lapis" data-tamanho="15"></span>Editar bio
          </button>
        </div>

        <p id="bio-texto" class="bio-texto"></p>
        <p id="erro-foto" class="erro-inline" hidden></p>

        <form id="form-bio" class="form-bio" hidden>
          <textarea id="input-bio" maxlength="280" placeholder="Escreva uma bio curta..."></textarea>
          <div class="form-bio-rodape">
            <span id="contador-bio" class="contador-bio">0/280</span>
            <div class="form-bio-botoes">
              <button type="button" id="btn-cancelar-bio" class="botao botao--secundario botao--pequeno">Cancelar</button>
              <button type="submit" class="botao botao--pequeno">Salvar</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
