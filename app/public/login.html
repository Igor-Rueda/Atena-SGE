<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Atenas SGE</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-simples">
    <div class="cartao auth__cartao">
      <!-- se o arquivo não existir, a imagem some em vez de mostrar o ícone de imagem quebrada -->
      <img class="logo-login" src="assets/logo.png" alt="Atenas SGE" onerror="this.style.display='none'">

      <h1>Entrar</h1>
      <p class="texto-suave">Acesse sua conta para continuar.</p>

      <form id="form-login">
        <div class="campo"><label for="email">E-mail</label><input type="email" id="email" name="email" required autocomplete="email"></div>
        <div class="campo"><label for="senha">Senha</label><input type="password" id="senha" name="senha" required autocomplete="current-password"></div>
        <button type="submit" class="botao botao--bloco">Entrar</button>
      </form>

      <p id="mensagem-erro" class="aviso aviso--erro" hidden></p>

      <p class="auth__links">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      <p class="auth__links"><a href="esqueci-senha.html">Esqueci minha senha</a></p>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
