<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Atenas SGE</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    /* logo da tela de login: arquivo em app/public/assets/logo.png */
    .logo-login {
      display: block;
      width: 100%;
      max-width: 180px;
      height: auto;
      margin: 0 auto 20px;
    }
  </style>
</head>
<body>
  <main class="auth-container">
    <!-- se o arquivo não existir, a imagem some em vez de mostrar o ícone de imagem quebrada -->
    <img src="assets/logo.png" alt="Atenas SGE" class="logo-login" onerror="this.style.display='none'">

    <h1>Entrar</h1>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="email">

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>

    <p id="mensagem-erro" class="erro" hidden></p>

    <p class="link-secundario">
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </p>
    <p class="link-secundario link-esqueci-senha">
      <a href="esqueci-senha.html">Esqueci minha senha</a>
    </p>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
