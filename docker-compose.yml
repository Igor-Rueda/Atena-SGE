services:
  app:
    build: ./app
    image: igorrueda/atenas-app:latest
    env_file: .env
    ports:
      - "${PORT_APP:-3000}:${PORT_APP:-3000}"
    depends_on:
      - auth-service
      - log-service
      - profile-service
      - pagamentos
      - regressao

  auth-service:
    build: ./auth-service
    image: igorrueda/atenas-auth-service:latest
    env_file: .env
    depends_on:
      - log-service

  pagamentos:
    build: ./pagamentos
    image: igorrueda/atenas-pagamentos:latest
    # sem "ports:" -- só o app fala com ele (checkout e webhook do Stripe entram
    # pelo app, que repassa pela rede interna). Guarda a chave do Stripe.
    env_file: .env
    depends_on:
      - auth-service
      - log-service
    restart: unless-stopped

  # Regressão linear múltipla (Python). Sem "ports:" -- só o app fala com ele, com a
  # INTERNAL_API_KEY. Não recebe chave do Stripe nem de e-mail: só precisa do banco.
  regressao:
    build: ./regressao
    image: igorrueda/atenas-regressao:latest
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT_REGRESSAO', '6000') + '/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    # sem "ports:" -- mesmo princípio do auth-service: só acessível pela
    # rede interna do Docker, nunca pela internet
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  log-service:
    build: ./log-service
    image: igorrueda/atenas-log-service:latest
    # sem "ports:" -- não publicado pro host
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.0.0
    # SEM "ports:" -- o navegador nunca fala com o Garage direto. Essa hospedagem só
    # roteia de forma confiável a porta principal do projeto (a do app); uma porta
    # extra publicada aqui não é estável (testado e confirmado). Quem fala com o Garage
    # é só o profile-service, pela rede interna do Docker.
    volumes:
      - ./upload-profile/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  profile-service:
    build: ./upload-profile/profile-service
    image: igorrueda/atenas-profile-service:latest
    container_name: profile-service
    env_file: .env
    depends_on:
      - garage
    restart: unless-stopped

volumes:
  redis-data:
  garage-meta:
  garage-data: