name: CI/CD

# Só roda em push na main -- sem branches de desenvolvimento paralelas neste projeto
on:
  push:
    branches: [main]

jobs:
  # ---------- JOB 1: builda e testa de ponta a ponta ----------
  # Se qualquer passo aqui falhar, o job 2 nunca roda (needs: build-and-test)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar .env de teste (valores fake, exclusivos de CI)
        run: cp .github/ci/.env.ci .env

      # O garage.toml real não é versionado (tem segredo). Sem o arquivo, o Docker cria uma
      # PASTA no lugar dele e o Garage cai em loop ("Is a directory"), e o `up --wait` falha.
      # No CI basta uma configuração descartável, com segredos fake (nunca use em produção).
      - name: Criar garage.toml de teste (valores fake, exclusivos de CI)
        run: |
          mkdir -p upload-profile/garage
          cat > upload-profile/garage/garage.toml <<'EOF'
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"
          replication_factor = 1

          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "1111111111111111111111111111111111111111111111111111111111111111"

          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          root_domain = ".s3.garage.localhost"

          [admin]
          api_bind_addr = "[::]:3903"
          admin_token = "token-fake-de-ci"
          metrics_token = "token-fake-de-ci"
          EOF

      - name: Buildar imagens e subir o ambiente de teste
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 180

      # O .github/ci/schema.sql é a junção de db/000_base.sql, db/001_dominio.sql e db/003_assinaturas.sql
      # (as tabelas assinaturas e eventos_stripe são necessárias ao webhook e às rotas de assinatura).
      - name: Aplicar schema no banco de teste
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T mariadb mariadb -u root -pteste atenas_test < .github/ci/schema.sql

      - name: Aguardar o app responder
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App no ar."
              exit 0
            fi
            echo "Aguardando app subir... ($i/30)"
            sleep 2
          done
          echo "App não respondeu a tempo."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      # Este é o teste que efetivamente prova que o código funciona: cadastra
      # um usuário de verdade e faz login de verdade, checando o status HTTP.
      # Se qualquer uma dessas chamadas falhar, o job (e o pipeline) quebra aqui.
      # OBSERVAÇÃO: profile-service e Garage ainda não fazem parte deste teste de
      # ponta a ponta -- só sobem e são publicados, upload de foto continua
      # validado manualmente (ver README, seção do profile-service).
      - name: Testar cadastro e login
        run: |
          EMAIL="ci-teste-$(date +%s)@exemplo.com"
          SENHA="senha123456"
          EMPRESA="CI Empresa Teste $(date +%s)"

          # O cadastro exige empresa. A categoria "superior" cria a empresa (nome único).
          echo "Cadastrando usuário de teste ($EMAIL, empresa: $EMPRESA)..."
          STATUS_CADASTRO=$(curl -s -o /tmp/cadastro.json -w "%{http_code}" -X POST http://localhost:3000/api/auth/cadastro \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"CI Teste\",\"email\":\"$EMAIL\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA\",\"categoria\":\"superior\"}")

          echo "Status HTTP do cadastro: $STATUS_CADASTRO"
          cat /tmp/cadastro.json
          echo ""

          if [ "$STATUS_CADASTRO" != "201" ]; then
            echo ""
            echo "Cadastro falhou -- pipeline quebrado."
            exit 1
          fi

          echo ""
          echo "Fazendo login..."
          STATUS_LOGIN=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"senha\":\"$SENHA\"}")

          echo "Status HTTP do login: $STATUS_LOGIN"
          cat /tmp/login.json
          echo ""

          if [ "$STATUS_LOGIN" != "200" ]; then
            echo ""
            echo "Login falhou -- pipeline quebrado."
            exit 1
          fi

          echo ""
          echo "Cadastro e login OK -- rota de autenticação está funcionando."

      # Pagamentos (Stripe): no CI não dá pra cobrar de verdade (as chaves são fake), mas dá pra
      # provar o que mais quebra nessa integração: o webhook passando CRU pelo app até o
      # serviço pagamentos (assinatura válida -> 200; ausente ou forjada -> 400), a idempotência
      # (o mesmo evento reenviado não é processado de novo), a rota de checkout protegida por
      # login, e a renovação de token -- que exercita a rota interna do auth-service com a
      # INTERNAL_API_KEY, ou seja, a fiação entre os três serviços.
      - name: Testar pagamentos (webhook, idempotência, checkout protegido e renovação de token)
        run: |
          falhar() { echo ""; echo "FALHOU: $1 -- pipeline quebrado."; exit 1; }

          URL="http://localhost:3000"
          # id único por execução: o evento é gravado em eventos_stripe (idempotência)
          EVENTO_ID="evt_ci_$(date +%s)_$$"
          PAYLOAD="{\"id\":\"$EVENTO_ID\",\"object\":\"event\",\"type\":\"ping\",\"data\":{\"object\":{}}}"

          echo "1) Webhook SEM assinatura (esperado 400)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/stripe/webhook" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "   status: $STATUS"
          [ "$STATUS" = "400" ] || falhar "webhook sem assinatura deveria responder 400"

          echo "2) Webhook com assinatura FORJADA (esperado 400)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/stripe/webhook" \
            -H "Content-Type: application/json" -H "stripe-signature: t=1,v1=abc" -d "$PAYLOAD")
          echo "   status: $STATUS"
          [ "$STATUS" = "400" ] || falhar "webhook com assinatura forjada deveria responder 400"

          echo "3) Webhook com assinatura VÁLIDA (esperado 200)..."
          # o Stripe assina "<timestamp>.<corpo>" com HMAC-SHA256 usando o segredo do endpoint.
          # Se o corpo chegar alterado ao serviço pagamentos, esta verificação falha.
          SEGREDO=$(grep '^STRIPE_WEBHOOK_SECRET=' .env | cut -d= -f2- | tr -d '\r')
          [ -n "$SEGREDO" ] || falhar "STRIPE_WEBHOOK_SECRET ausente do .env.ci"
          TS=$(date +%s)
          ASSINATURA=$(printf '%s' "$TS.$PAYLOAD" | openssl dgst -sha256 -hmac "$SEGREDO" | sed 's/^.* //')
          STATUS=$(curl -s -o /tmp/webhook.txt -w "%{http_code}" -X POST "$URL/api/stripe/webhook" \
            -H "Content-Type: application/json" -H "stripe-signature: t=$TS,v1=$ASSINATURA" -d "$PAYLOAD")
          echo "   status: $STATUS"
          [ "$STATUS" = "200" ] || { cat /tmp/webhook.txt; falhar "webhook com assinatura válida deveria responder 200"; }
          if grep -q '"duplicate":true' /tmp/webhook.txt; then
            falhar "a primeira entrega do evento foi tratada como duplicada"
          fi

          echo "3b) O evento ficou registrado em eventos_stripe (prova que o schema 003 foi aplicado)..."
          REGISTRADOS=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T mariadb mariadb -u root -pteste atenas_test -N -e \
            "SELECT COUNT(*) FROM eventos_stripe WHERE id = '$EVENTO_ID'" | tr -d '\r\n ')
          echo "   registros: $REGISTRADOS"
          [ "$REGISTRADOS" = "1" ] || falhar "o evento não foi gravado em eventos_stripe"

          echo "3c) O MESMO evento reenviado não pode ser processado de novo (esperado 200 com duplicate)..."
          STATUS=$(curl -s -o /tmp/webhook2.txt -w "%{http_code}" -X POST "$URL/api/stripe/webhook" \
            -H "Content-Type: application/json" -H "stripe-signature: t=$TS,v1=$ASSINATURA" -d "$PAYLOAD")
          echo "   status: $STATUS"
          cat /tmp/webhook2.txt; echo ""
          [ "$STATUS" = "200" ] || falhar "o reenvio do evento deveria responder 200"
          grep -q '"duplicate":true' /tmp/webhook2.txt || falhar "o reenvio do mesmo evento deveria ser marcado como duplicate"

          echo "4) Checkout sem login (esperado 401)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/assinatura/checkout" \
            -H "Content-Type: application/json" -d '{"plano":"expert"}')
          echo "   status: $STATUS"
          [ "$STATUS" = "401" ] || falhar "checkout sem login deveria responder 401"

          echo "5) Renovação de token (cadastro -> login -> renovar)..."
          EMAIL="ci-pagamentos-$(date +%s)@exemplo.com"
          SENHA="senha123456"
          EMPRESA="CI Empresa Pagamentos $(date +%s)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/cadastro" \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"CI Pagamentos\",\"email\":\"$EMAIL\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA\",\"categoria\":\"superior\"}")
          [ "$STATUS" = "201" ] || falhar "cadastro do usuário de teste falhou (status $STATUS)"

          STATUS=$(curl -s -D /tmp/login-headers.txt -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"senha\":\"$SENHA\"}")
          [ "$STATUS" = "200" ] || falhar "login do usuário de teste falhou (status $STATUS)"

          # o cookie é Secure (só vai por HTTPS), então o token é lido do Set-Cookie e enviado à mão
          TOKEN=$(sed -nE 's/^[Ss]et-[Cc]ookie: token=([^;]+);.*/\1/p' /tmp/login-headers.txt | head -n 1)
          [ -n "$TOKEN" ] || falhar "o login não devolveu o cookie de sessão"

          STATUS=$(curl -s -o /tmp/renovar.json -w "%{http_code}" -X POST "$URL/api/auth/renovar" \
            -H "Cookie: token=$TOKEN")
          echo "   status: $STATUS"
          cat /tmp/renovar.json; echo ""
          [ "$STATUS" = "200" ] || falhar "renovação de token falhou (app -> auth-service /internos)"
          grep -q '"role":"professional"' /tmp/renovar.json || falhar "renovação não devolveu o papel esperado"

          echo ""
          echo "Pagamentos OK -- webhook, idempotência, checkout protegido e renovação de token funcionando."

      # Assinatura (Stripe): rotas que o app repassa ao serviço pagamentos (/status, /portal, /admin/resumo).
      # Sem Stripe real, testa-se o que depende só do nosso código: proteção por login, proteção por
      # papel (admin) e as respostas de uma conta nova, que ainda não tem assinatura nem cliente no Stripe.
      # O fluxo completo (checkout, portal e os webhooks com dados reais) continua no roteiro manual (14.9 a 14.15).
      - name: Testar assinatura (status, portal e painel admin)
        run: |
          falhar() { echo ""; echo "FALHOU: $1 -- pipeline quebrado."; exit 1; }

          URL="http://localhost:3000"
          SENHA="senha123456"
          TS=$(date +%s)
          EMAIL="ci-assinatura-$TS@exemplo.com"
          EMPRESA="CI Empresa Assinatura $TS"

          echo "1) Rotas de assinatura sem login (esperado 401 em todas)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/assinatura")
          echo "   estado da assinatura: $STATUS"
          [ "$STATUS" = "401" ] || falhar "GET /api/assinatura sem login deveria responder 401 (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/assinatura/portal")
          echo "   portal: $STATUS"
          [ "$STATUS" = "401" ] || falhar "POST /api/assinatura/portal sem login deveria responder 401 (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/admin/resumo")
          echo "   painel admin: $STATUS"
          [ "$STATUS" = "401" ] || falhar "GET /api/admin/resumo sem login deveria responder 401 (status $STATUS)"

          echo "2) Cadastro e login de uma conta nova (plano Professional)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/cadastro" \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"CI Assinatura\",\"email\":\"$EMAIL\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA\",\"categoria\":\"superior\"}")
          [ "$STATUS" = "201" ] || falhar "cadastro do usuário de teste (status $STATUS)"
          STATUS=$(curl -s -D /tmp/assinatura-headers.txt -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"senha\":\"$SENHA\"}")
          [ "$STATUS" = "200" ] || falhar "login do usuário de teste (status $STATUS)"
          # o cookie é Secure (só vai por HTTPS), então o token é lido do Set-Cookie e enviado à mão
          TOKEN=$(sed -nE 's/^[Ss]et-[Cc]ookie: token=([^;]+);.*/\1/p' /tmp/assinatura-headers.txt | head -n 1)
          [ -n "$TOKEN" ] || falhar "o login não devolveu o cookie de sessão"

          echo "3) Conta nova ainda não tem assinatura (esperado 200 com sem_assinatura)..."
          STATUS=$(curl -s -o /tmp/assinatura.json -w "%{http_code}" "$URL/api/assinatura" -H "Cookie: token=$TOKEN")
          cat /tmp/assinatura.json; echo ""
          [ "$STATUS" = "200" ] || falhar "GET /api/assinatura logado deveria responder 200 (status $STATUS)"
          grep -q '"status":"sem_assinatura"' /tmp/assinatura.json || falhar "uma conta nova deveria vir sem assinatura"

          echo "4) Portal do cliente sem ter assinado (esperado 404: ainda não existe cliente no Stripe)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/assinatura/portal" -H "Cookie: token=$TOKEN")
          echo "   status: $STATUS"
          [ "$STATUS" = "404" ] || falhar "o portal para quem nunca assinou deveria responder 404 (status $STATUS)"

          echo "5) Checkout com plano inexistente (esperado 400, antes de chamar o Stripe)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/assinatura/checkout" \
            -H "Content-Type: application/json" -H "Cookie: token=$TOKEN" -d '{"plano":"premium"}')
          echo "   status: $STATUS"
          [ "$STATUS" = "400" ] || falhar "checkout com plano inválido deveria responder 400 (status $STATUS)"

          echo "6) Painel admin com conta que não é admin (esperado 403)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/admin/resumo" -H "Cookie: token=$TOKEN")
          echo "   status: $STATUS"
          [ "$STATUS" = "403" ] || falhar "o painel admin deveria recusar quem não é admin (status $STATUS)"

          echo ""
          echo "Assinatura OK -- rotas protegidas por login e por papel, e respostas corretas para conta sem assinatura."

      # Isolamento entre empresas (multi-tenancy): duas empresas, e a B tenta mexer no que é da A.
      # Tudo que é da outra empresa deve responder 404 (e não 403, para não revelar que existe).
      # OBSERVAÇÃO: o login do auth-service limita as tentativas por IP (5 a cada 15 min em produção).
      # No CI todas as chamadas vêm do mesmo IP, por isso o docker-compose.ci.yml define
      # RATE_LIMIT_SENSIVEL_MAX no auth-service. Sem essa variável, o limite volta a 5.
      - name: Testar isolamento entre empresas
        run: |
          falhar() { echo ""; echo "FALHOU: $1 -- pipeline quebrado."; exit 1; }

          URL="http://localhost:3000"
          SENHA="senha123456"
          TS=$(date +%s)
          EMAIL_A="ci-iso-a-$TS@exemplo.com"
          EMAIL_B="ci-iso-b-$TS@exemplo.com"
          EMPRESA_A="CI Isolamento A $TS"
          EMPRESA_B="CI Isolamento B $TS"

          echo "1) Cadastro do Superior de cada empresa (esperado 201)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/cadastro" \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"Superior A\",\"email\":\"$EMAIL_A\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA_A\",\"categoria\":\"superior\"}")
          [ "$STATUS" = "201" ] || falhar "cadastro do Superior A (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/cadastro" \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"Superior B\",\"email\":\"$EMAIL_B\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA_B\",\"categoria\":\"superior\"}")
          [ "$STATUS" = "201" ] || falhar "cadastro do Superior B (status $STATUS)"

          echo "2) Entrar na empresa A sem o código certo (esperado 403)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/cadastro" \
            -H "Content-Type: application/json" \
            -d "{\"nome\":\"Intruso\",\"email\":\"ci-intruso-$TS@exemplo.com\",\"senha\":\"$SENHA\",\"empresa\":\"$EMPRESA_A\",\"categoria\":\"planejador\",\"codigo_empresa\":\"CODIGOERRADO\"}")
          echo "   status: $STATUS"
          [ "$STATUS" = "403" ] || falhar "cadastro com código errado deveria responder 403"

          echo "3) Login das duas empresas..."
          STATUS=$(curl -s -D /tmp/iso-a.txt -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL_A\",\"senha\":\"$SENHA\"}")
          [ "$STATUS" = "200" ] || falhar "login do Superior A (status $STATUS)"
          STATUS=$(curl -s -D /tmp/iso-b.txt -o /dev/null -w "%{http_code}" -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL_B\",\"senha\":\"$SENHA\"}")
          [ "$STATUS" = "200" ] || falhar "login do Superior B (status $STATUS)"

          # o cookie é Secure (só vai por HTTPS), então o token é lido do Set-Cookie e enviado à mão
          TOKEN_A=$(sed -nE 's/^[Ss]et-[Cc]ookie: token=([^;]+);.*/\1/p' /tmp/iso-a.txt | head -n 1)
          TOKEN_B=$(sed -nE 's/^[Ss]et-[Cc]ookie: token=([^;]+);.*/\1/p' /tmp/iso-b.txt | head -n 1)
          [ -n "$TOKEN_A" ] && [ -n "$TOKEN_B" ] || falhar "o login não devolveu o cookie de sessão"

          echo "4) A cria um projeto (esperado 201)..."
          STATUS=$(curl -s -o /tmp/iso-projeto.json -w "%{http_code}" -X POST "$URL/api/projetos" \
            -H "Content-Type: application/json" -H "Cookie: token=$TOKEN_A" \
            -d '{"nome":"Projeto secreto da empresa A"}')
          cat /tmp/iso-projeto.json; echo ""
          [ "$STATUS" = "201" ] || falhar "criar projeto na empresa A (status $STATUS)"
          ID=$(sed -nE 's/.*"id":([0-9]+).*/\1/p' /tmp/iso-projeto.json | head -n 1)
          [ -n "$ID" ] || falhar "a criação do projeto não devolveu o id"

          echo "5) A enxerga o próprio projeto (esperado 200)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/projetos/$ID" -H "Cookie: token=$TOKEN_A")
          [ "$STATUS" = "200" ] || falhar "A deveria abrir o próprio projeto (status $STATUS)"

          echo "6) B tenta abrir, editar, concluir e excluir o projeto de A (esperado 404 em tudo)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/projetos/$ID" -H "Cookie: token=$TOKEN_B")
          echo "   abrir: $STATUS"
          [ "$STATUS" = "404" ] || falhar "B abriu o projeto de A (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "$URL/api/projetos/$ID" \
            -H "Content-Type: application/json" -H "Cookie: token=$TOKEN_B" -d '{"nome":"invadido"}')
          echo "   editar: $STATUS"
          [ "$STATUS" = "404" ] || falhar "B editou o projeto de A (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$URL/api/projetos/$ID/concluir" -H "Cookie: token=$TOKEN_B")
          echo "   concluir: $STATUS"
          [ "$STATUS" = "404" ] || falhar "B concluiu o projeto de A (status $STATUS)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$URL/api/projetos/$ID" -H "Cookie: token=$TOKEN_B")
          echo "   excluir: $STATUS"
          [ "$STATUS" = "404" ] || falhar "B excluiu o projeto de A (status $STATUS)"

          echo "7) A lista de projetos de B não pode conter o projeto de A..."
          curl -s "$URL/api/projetos" -H "Cookie: token=$TOKEN_B" > /tmp/iso-lista-b.json
          cat /tmp/iso-lista-b.json; echo ""
          if grep -q "Projeto secreto da empresa A" /tmp/iso-lista-b.json; then
            falhar "a lista de B mostrou o projeto de A"
          fi

          echo "8) B tenta ver o perfil de um usuário de A (esperado 404)..."
          ID_A=$(curl -s "$URL/api/me" -H "Cookie: token=$TOKEN_A" | sed -nE 's/.*"usuario_id":([0-9]+).*/\1/p')
          [ -n "$ID_A" ] || falhar "não consegui o id do usuário A"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/perfil/$ID_A" -H "Cookie: token=$TOKEN_B")
          echo "   status: $STATUS"
          [ "$STATUS" = "404" ] || falhar "B viu o perfil de A (status $STATUS)"

          echo "9) O projeto de A continua intacto (esperado 200)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/projetos/$ID" -H "Cookie: token=$TOKEN_A")
          [ "$STATUS" = "200" ] || falhar "o projeto de A sumiu ou mudou (status $STATUS)"

          echo ""
          echo "Isolamento OK -- a empresa B não enxerga nem altera nada da empresa A."

      # Regressão (Python): testes unitários do modelo + chamadas HTTP de verdade, feitas de
      # dentro do container (o serviço não publica porta). Sem chave interna = 403; entrada
      # inválida = 400; previsão válida devolve um número.
      - name: Testar regressão (modelo e API)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T regressao python -m unittest discover -s tests -v
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T regressao python tests/smoke_http.py

      - name: Logs dos containers (em caso de falha)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ---------- JOB 2: publica as imagens (o deploy continua manual) ----------
  # Só começa se build-and-test passou -- é isso que garante que uma imagem
  # quebrada nunca chega a ser publicada nem implantada.
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Definir tag rastreável do commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push -- app
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            igorrueda/atenas-app:latest
            igorrueda/atenas-app:sha-${{ steps.vars.outputs.sha_short }}

      - name: Build & push -- auth-service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: |
            igorrueda/atenas-auth-service:latest
            igorrueda/atenas-auth-service:sha-${{ steps.vars.outputs.sha_short }}

      - name: Build & push -- log-service
        uses: docker/build-push-action@v6
        with:
          context: ./log-service
          push: true
          tags: |
            igorrueda/atenas-log-service:latest
            igorrueda/atenas-log-service:sha-${{ steps.vars.outputs.sha_short }}

      # NOVO -- sem isso, a imagem do profile-service nunca existe no Docker Hub e
      # o Portainer falha o deploy dessa stack ("pull access denied").
      # O Garage NÃO entra aqui: é a imagem oficial dxflrs/garage, publicada por
      # terceiros -- não tem código nosso pra buildar nem publicar.
      - name: Build & push -- profile-service
        uses: docker/build-push-action@v6
        with:
          context: ./upload-profile/profile-service
          push: true
          tags: |
            igorrueda/atenas-profile-service:latest
            igorrueda/atenas-profile-service:sha-${{ steps.vars.outputs.sha_short }}

      # Serviço de pagamentos (Stripe). Sem esta imagem no Docker Hub, o Portainer
      # falha o deploy da stack ("pull access denied"), igual ao caso do profile-service.
      - name: Build & push -- pagamentos
        uses: docker/build-push-action@v6
        with:
          context: ./pagamentos
          push: true
          tags: |
            igorrueda/atenas-pagamentos:latest
            igorrueda/atenas-pagamentos:sha-${{ steps.vars.outputs.sha_short }}

      - name: Build & push -- regressao
        uses: docker/build-push-action@v6
        with:
          context: ./regressao
          push: true
          tags: |
            igorrueda/atenas-regressao:latest
            igorrueda/atenas-regressao:sha-${{ steps.vars.outputs.sha_short }}

      # DEPLOY: não automatizado nesta versão. Ver README, seção "Deploy",
      # para o passo manual que fecha o restante do fluxo.
      - name: Lembrete de deploy manual
        run: |
          echo "Imagens publicadas com sucesso:"
          echo "  igorrueda/atenas-app:sha-${{ steps.vars.outputs.sha_short }}"
          echo "  igorrueda/atenas-auth-service:sha-${{ steps.vars.outputs.sha_short }}"
          echo "  igorrueda/atenas-log-service:sha-${{ steps.vars.outputs.sha_short }}"
          echo "  igorrueda/atenas-profile-service:sha-${{ steps.vars.outputs.sha_short }}"
          echo "  igorrueda/atenas-pagamentos:sha-${{ steps.vars.outputs.sha_short }}"
          echo "  igorrueda/atenas-regressao:sha-${{ steps.vars.outputs.sha_short }}"
          echo ""
          echo "Deploy automático pendente (ver README) -- atualize a stack"
          echo "manualmente no Portainer: 'Re-pull image and redeploy'."